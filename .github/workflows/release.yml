name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNER_SHA256: 6e4898458b6583c33806821eb44721d97db5261ff0d0c27e7fef2b0aeb433340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          $v = Get-AppVersion
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$v</Version> in MyDeck.Server.csproj" }

      - name: Restore the signing key
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.MYDECK_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.MYDECK_KEY_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw 'The MYDECK_KEYSTORE_B64 secret is missing' }
          $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "MYDECK_KEYSTORE=$ks" >> $env:GITHUB_ENV
          if (-not $env:KEY_PASSWORD) { throw 'The MYDECK_KEY_PASSWORD secret is missing' }
          "MYDECK_STORE_PASSWORD=$env:KEY_PASSWORD" >> $env:GITHUB_ENV
          "MYDECK_KEY_ALIAS=mydeck" >> $env:GITHUB_ENV
          "MYDECK_KEY_PASSWORD=$env:KEY_PASSWORD" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: ./scripts/release.ps1

      - name: Check the APK signature
        shell: pwsh
        run: |
          $signer = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $out = & (Join-Path $signer.FullName 'apksigner.bat') verify --print-certs out/MyDeck.apk
          $out
          if (-not ($out -match "SHA-256 digest: $env:SIGNER_SHA256")) { throw 'The APK is not signed with the MyDeck release key' }

      - name: Keep the test build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: MyDeck-test-build
          path: |
            dist/MyDeck-win-x64.zip
            dist/MyDeck-win-x64.zip.sha256
            dist/MyDeck-Setup.exe
            dist/*.mydeckplugin
          retention-days: 7

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MyDeck-win-x64.zip
            dist/MyDeck-win-x64.zip.sha256
            dist/MyDeck-Setup.exe
            dist/*.mydeckplugin
          body_path: .github/release-notes.md
          make_latest: true

      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'release.jks') -Force -ErrorAction SilentlyContinue
